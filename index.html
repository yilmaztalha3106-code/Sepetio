<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepetio V2</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOADER -->
    <div id="loader">
        <h1>SEPETIO</h1>
    </div>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            <h1>Sepetio</h1>
        </div>

        <form class="search-form">

            <input
                type="text"
                placeholder="Ürün, marka veya kategori ara...">

            <button type="submit">
                Ara
            </button>

        </form>

        <div class="header-buttons">

            <button class="favorite-btn">
                ❤️ Favoriler
            </button>

            <button class="cart-btn">
                🛒 Sepet
                <span class="cart-count">0</span>
            </button>

            <button class="login-btn">
                Giriş Yap
            </button>

        </div>

    </header>

    <!-- MENÜ -->

    <nav class="menu">

        <a href="#">Elektronik</a>
        <a href="#">Moda</a>
        <a href="#">Süpermarket</a>
        <a href="#">Ev Yaşam</a>
        <a href="#">Kozmetik</a>
        <a href="#">Spor</a>
        <a href="#">Oyun</a>
        <a href="#">Kitap</a>

    </nav>

    <!-- HERO -->

    <section class="hero">

        <div class="hero-text">

            <h2>
                Türkiye'nin Yeni Alışveriş Platformu
            </h2>

            <p>
                Binlerce mağaza, milyonlarca ürün,
                güvenli alışveriş deneyimi.
            </p>

            <button>
                Alışverişe Başla
            </button>

        </div>

    </section>

    <!-- ÜRÜNLER BURAYA GELECEK -->
