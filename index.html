<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepetio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Sepetio</h1>

    <input type="text" placeholder="Ürün ara...">

    <button>🔍</button>
    <button>➕ Ürün Ekle</button>
    <button>👤 Profil</button>
<button onclick="showCart()">🛒 Sepet (<span id="cartCount">0</span>)</button>
</header>
    


<section class="banner">
    <h2>Türkiye'nin Yeni Alışveriş Platformu</h2>
    <p>Binlerce ürün, güvenli alışveriş.</p>
</section>


<section class="products">

    <div class="product">
        <h3>Akıllı Saat</h3>
        <p>999 TL</p>
        <button>Sepete Ekle</button>
    </div>


    <div class="product">
        <h3>Oyuncu Kulaklığı</h3>
        <p>799 TL</p>
        <button>Sepete Ekle</button>
    </div>


    <div class="product">
        <h3>Telefon Kılıfı</h3>
        <p>199 TL</p>
        <button>Sepete Ekle</button>
    </div>

</section>


<script src="app.js"></script>

</body>
</html>
