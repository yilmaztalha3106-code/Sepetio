<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepetio - Giriş Yap</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            width:350px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.2);
        }

        h1{
            text-align:center;
            margin-bottom:20px;
            color:#00a651;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#00a651;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#008a43;
        }

        p{
            text-align:center;
            margin-top:15px;
        }

        a{
            color:#00a651;
            text-decoration:none;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="login-box">

<h1>Sepetio</h1>

<input type="email" placeholder="E-posta">

<input type="password" placeholder="Şifre">

<button>Giriş Yap</button>

<p>Hesabın yok mu? <a href="#">Kayıt Ol</a></p>

</div>

</body>
</html>
